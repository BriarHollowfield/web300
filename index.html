<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram — приєднатися до каналу</title>
  <meta name="description" content="Приєднуйся до нашого каналу в Telegram">
  <!-- k300 -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --surface-top: #0f172a;
      --surface-bottom: #1e293b;
      --fg: #e2e8f0;
      --faded: #64748b;
      --footer-link: #94a3b8;
      --footer-link-accent: #e2e8f0;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --surface-top: #f8fafc;
        --surface-bottom: #e2e8f0;
        --fg: #1e293b;
        --faded: #64748b;
        --footer-link: #64748b;
        --footer-link-accent: #0f172a;
      }
    }

    html { height: 100%; background: var(--surface-bottom); }
    body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom, var(--surface-top), var(--surface-bottom));
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .stage {
      width: 100%;
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 48px;
      border-radius: 60px;
      background: linear-gradient(to bottom, #37aee2, #1e96c8);
      box-shadow: 0 12px 32px rgba(30, 150, 200, 0.45);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(30, 150, 200, 0.6); }
    .cta-btn:active { transform: translateY(0); }
    .cta-btn svg { width: 30px; height: 30px; fill: #fff; flex-shrink: 0; }

    .site-footer {
      width: 100%;
      padding: 28px 16px 36px;
      text-align: center;
      font-size: 13px;
      color: var(--faded);
    }

    .site-footer a {
      margin: 0 8px;
      color: var(--footer-link);
      white-space: nowrap;
      text-decoration: none;
    }

    .site-footer a:hover { text-decoration: underline; color: var(--footer-link-accent); }

    .divider { margin: 0 8px; }

    @media (max-width: 480px) {
      .cta-btn { font-size: 19px; padding: 18px 32px; gap: 12px; max-width: 100%; }
      .cta-btn svg { width: 26px; height: 26px; }
      .site-footer { padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
      .site-footer a { display: block; margin: 8px 0; }
      .divider { display: none; }
    }
  </style>

  <script>
    function getUrlParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    const pixelId = getUrlParam("pixel");

    if (pixelId) {
      !(function (w, d, tag, src, q, t, first) {
        if (w.fbq) return;
        q = w.fbq = function () {
          q.callMethod
            ? q.callMethod.apply(q, arguments)
            : q.queue.push(arguments);
        };
        if (!w._fbq) w._fbq = q;
        q.push = q;
        q.loaded = true;
        q.version = "2.0";
        q.queue = [];
        t = d.createElement(tag);
        t.async = true;
        t.src = src;
        first = d.getElementsByTagName(tag)[0];
        first.parentNode.insertBefore(t, first);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");

      fbq("init", pixelId);
      fbq("track", "PageView");
    }
  </script>
</head>
<body>
  <main class="stage">
    <a class="cta-btn" href="tg://join?invite=hAhLnH61N-hhNTQy" onclick="fbq('track', 'Lead')">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 12.86 3.64 11.6c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Приєднатися в Telegram
    </a>
  </main>

  <footer class="site-footer">
    <a href="privacy.html">Політика приватності</a><span class="divider">·</span><a href="cookies.html">Cookie-файли</a><span class="divider">·</span><a href="terms.html">Правила користування</a>
  </footer>
</body>
</html>
